# Staging dispatch guard (issue #1957) — cancels a Publish Host run whose `dispatch-staging`
# deployment GitHub has left WAITING on the `staging-dispatch` environment although nothing in
# that environment could ever release it.
#
# Why it exists. On 6 Oct 2026 18:44 UTC GitHub left run 37513444217's `dispatch-staging`
# deployment in `waiting` with no reviewer: `staging-dispatch` has only a branch policy (develop),
# and the same job had deployed 28 minutes earlier (#1937). Publish Host serialises
# (`cancel-in-progress: false`, see the concurrency comment in publish-host.yml), so every later
# develop push queued behind the stuck run and staging froze for ~13 hours. Cancelling the stuck
# run let the newest queued run deploy at once — this workflow does that cancel without a person.
#
# Why a separate, scheduled workflow rather than a step in Publish Host: the next Publish Host
# run is exactly what the stuck run blocks, so a step in it would never execute. The concurrency
# design in publish-host.yml is left untouched — the guard only removes a run GitHub will never
# finish, and the group then hands over to its newest pending run as it always does.
#
# What it cancels — ALL of these must hold, or it leaves the run alone:
#   * the run belongs to publish-host.yml and its status is `waiting`;
#   * its `dispatch-staging` job is `waiting`, and no job of the run is queued or in progress —
#     a run that is executing anything is never cancelled;
#   * the run's pending deployment is on `staging-dispatch`;
#   * that environment has no required-reviewer and no wait-timer rule. If someone has put a
#     human gate on it, a waiting run is waiting for that human and is theirs to approve or
#     reject; the guard says so and does nothing;
#   * the job has waited at least MIN_WAIT_MINUTES (30). A healthy deployment leaves `waiting`
#     in seconds; 30 minutes keeps the guard well clear of a slow-but-alive one.
# The run's status is read again immediately before the cancel.
#
# Production cannot be reached from here: the environment name is fixed below, the script
# refuses any name containing "prod", and the only write it can make is cancelling a run of
# publish-host.yml.
#
# Least privilege: `actions: write` (list runs and jobs, read pending deployments and the
# environment, cancel a run) and nothing else — no checkout, so no `contents` scope.
#
# Proven on 7 Oct 2026 against a throwaway environment in a throwaway repository (evidence on
# #1957): a run left waiting on an environment with no reviewer rule was cancelled and the queued
# run behind it went through; a run waiting on an environment WITH a reviewer, a young waiting
# run, and an executing run were all left alone.
name: Staging dispatch guard

on:
  workflow_dispatch:
    inputs:
      workflow: {default: stuck.yml}
      environment: {default: guard-test}
      min_wait: {default: '30'}

permissions:
  actions: write

concurrency:
  group: staging-dispatch-guard
  cancel-in-progress: false

env:
  GUARD_WORKFLOW: ${{ inputs.workflow }}
  GUARD_JOB: dispatch-staging
  GUARD_ENVIRONMENT: ${{ inputs.environment }}
  MIN_WAIT_MINUTES: ${{ inputs.min_wait }}

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel a publish run stuck waiting on staging-dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          case "${GUARD_ENVIRONMENT,,}" in
            *prod*) echo "::error::Refusing to act on environment '$GUARD_ENVIRONMENT'."; exit 1 ;;
          esac

          gates=$(gh api "repos/$repo/environments/$GUARD_ENVIRONMENT" \
            --jq '[.protection_rules[]?.type | select(. == "required_reviewers" or . == "wait_timer")] | join(",")')
          if [ -n "$gates" ]; then
            echo "::notice title=Staging dispatch guard idle::$GUARD_ENVIRONMENT has a human gate ($gates), so a waiting run there is waiting for a person. Nothing is cancelled."
            exit 0
          fi

          runs=$(gh api "repos/$repo/actions/workflows/$GUARD_WORKFLOW/runs?status=waiting&per_page=100" \
            --jq '.workflow_runs[].id')
          if [ -z "$runs" ]; then
            echo "No $GUARD_WORKFLOW run is waiting."
            exit 0
          fi

          now=$(date -u +%s)
          for run in $runs; do
            url="https://github.com/$repo/actions/runs/$run"
            jobs=$(gh api "repos/$repo/actions/runs/$run/jobs?filter=latest&per_page=100")
            busy=$(jq '[.jobs[] | select(.status == "queued" or .status == "in_progress")] | length' <<<"$jobs")
            waited_since=$(jq -r --arg job "$GUARD_JOB" \
              '[.jobs[] | select(.name == $job and .status == "waiting")][0].created_at // empty' <<<"$jobs")
            envs=$(gh api "repos/$repo/actions/runs/$run/pending_deployments" --jq '[.[].environment.name] | join(",")')
            if [ "$busy" != 0 ] || [ -z "$waited_since" ] || [ "$envs" != "$GUARD_ENVIRONMENT" ]; then
              echo "Leaving $url: busy jobs=$busy, $GUARD_JOB waiting since='${waited_since:-no}', pending environments='$envs'."
              continue
            fi
            minutes=$(( (now - $(date -u -d "$waited_since" +%s)) / 60 ))
            if [ "$minutes" -lt "$MIN_WAIT_MINUTES" ]; then
              echo "Leaving $url: $GUARD_JOB has waited $minutes min (threshold $MIN_WAIT_MINUTES)."
              continue
            fi
            status=$(gh api "repos/$repo/actions/runs/$run" --jq '.status')
            if [ "$status" != waiting ]; then
              echo "Leaving $url: its status moved to '$status' while the guard looked."
              continue
            fi
            gh api -X POST "repos/$repo/actions/runs/$run/cancel" --silent
            echo "::warning title=Stuck staging dispatch cancelled::Cancelled $url — its $GUARD_JOB deployment had waited $minutes min on $GUARD_ENVIRONMENT, which has no reviewer or wait-timer rule to release it (#1957). The newest queued $GUARD_WORKFLOW run, if any, now deploys develop to staging."
            printf -- '- Cancelled %s: `%s` waited %s min on `%s` with nothing able to release it.\n' \
              "$url" "$GUARD_JOB" "$minutes" "$GUARD_ENVIRONMENT" >> "$GITHUB_STEP_SUMMARY"
          done
